# hy Dracula — the hermes-powerline look for the Hermes web dashboard (and its web chat).
# Same palette as the TUI skin skins/hy-dracula.yaml (draculatheme.com/spec).
# Install: ~/.hermes/dashboard-themes/hy-dracula.yaml, then `hermes config set dashboard.theme hy-dracula`.
name: hy-dracula
label: hy Dracula
description: Dracula canvas with a jade-green accent — matches the hy powerline TUI
palette:
  background: '#282A36'
  midground: '#F8F8F2'
  foreground:
    hex: '#50FA7B'
    alpha: 0
  warmGlow: 'rgba(80, 250, 123, 0.14)'
  noiseOpacity: 0.35
typography:
  fontSans: 'Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  # Nerd Font first so the embedded TUI (web chat) draws the powerline glyphs and icons.
  fontMono: '"JetBrainsMono Nerd Font Mono", "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace'
  baseSize: 15px
  lineHeight: '1.55'
layout:
  radius: 0.6rem
  density: comfortable
colorOverrides:
  card: '#21222C'
  cardForeground: '#F8F8F2'
  popover: '#21222C'
  popoverForeground: '#F8F8F2'
  primary: '#50FA7B'
  primaryForeground: '#191A21'
  secondary: '#44475A'
  secondaryForeground: '#F8F8F2'
  muted: '#343746'
  mutedForeground: '#9AA5CE'
  accent: '#8BE9FD'
  accentForeground: '#191A21'
  destructive: '#FF5555'
  destructiveForeground: '#191A21'
  success: '#50FA7B'
  warning: '#FFB86C'
  border: '#44475A'
  input: '#343746'
  ring: '#50FA7B'
componentStyles:
  sidebar:
    background: '#21222C'
    borderColor: '#44475A'
  header:
    background: '#191A21'
    borderColor: '#44475A'
  tab:
    activeBackground: '#50FA7B'
    activeColor: '#191A21'
  progress:
    fill: '#50FA7B'
  badge:
    background: '#44475A'
    color: '#50FA7B'
