name: plan-auto
version: 1.1.0
description: "No file changes without an approved plan in interactive sessions (TUI/CLI): the first write_file/patch or coder delegation of a request is blocked and plan-mode is turned on, so the agent plans and asks for approval in the same turn. Requests that change nothing never touch plan mode (no extra round-trip). Skips subagents, cron, one-shot runs and 'làm luôn'. Requires the plan-mode plugin."
author: "Long Hoang Trinh"
provides_hooks:
  - pre_llm_call
  - pre_tool_call
